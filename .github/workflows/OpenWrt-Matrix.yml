# Reusable workflow for building OpenWrt firmware
name: OpenWrt-Matrix

on:
  workflow_call:
    inputs:
      targets:
        required: true
        type: string
        default: ""
      upload_source:
        required: false
        type: boolean
        default: false
      build_firmware:
        required: false
        type: boolean
        default: true
      lan_ip:
        required: false
        type: string
        default: "192.168.1.1"

  workflow_dispatch:
    inputs:
      targets:
        description: "Select target platforms (comma separated, e.g. R2C,R2S,R3S,R4S,X86 ;leave blank for all, case-insensitive)"
        required: false
        type: string
        default: ""
      upload_source:
        description: "Upload source folder before build"
        required: false
        type: boolean
        default: false
      build_firmware:
        description: "Build and publish firmware"
        required: false
        type: boolean
        default: true
      lan_ip:
        description: "Default LAN IP, default: 192.168.1.1"
        required: false
        type: string
        default: "192.168.1.1"

jobs:
  setup:
    runs-on: ubuntu-24.04
    if: github.event.repository.owner.id == github.event.sender.id
    steps:
      - id: set-matrix
        shell: bash
        run: |
          # All possible targets
          all_targets='[
            {"name": "R2C", "script_dir": "R2S", "arch": "rockchip/armv8", "arch_suffix": "3328"},
            {"name": "R2S", "script_dir": "R2S", "arch": "rockchip/armv8", "arch_suffix": "3328"},
            {"name": "R3S", "script_dir": "R4S", "arch": "rockchip/armv8", "arch_suffix": "3566"},
            {"name": "R4S", "script_dir": "R4S", "arch": "rockchip/armv8", "arch_suffix": "3399"},
            {"name": "X86", "script_dir": "X86", "arch": "x86/64", "arch_suffix": ""}
          ]'

          # User selected targets
          inputs_targets="${{ inputs.targets }}"
          # Replace Chinese comma with English comma, convert to uppercase
          inputs_targets=$(echo "$inputs_targets" | sed 's/，/,/g' | tr 'a-z' 'A-Z' | xargs)

          if [[ -z "$inputs_targets" ]]; then
            # If input is empty, run all targets
            echo "matrix=$(echo "$all_targets" | jq -c '{include: .}')" >> $GITHUB_OUTPUT
          else
            # Filter targets based on input
            filtered_targets=$(echo "$all_targets" | jq --arg targets "$inputs_targets" '[.[] | select(.name as $name | ($targets | split(",") | map(gsub(" "; "")) | index($name))) ]')
            echo "matrix=$(echo "$filtered_targets" | jq -c '{include: .}')" >> $GITHUB_OUTPUT
          fi
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

  build:
    needs: setup
    env: # default values, will be overridden later
      seed: dummy
      artifact_prefix: dummy
      sha_match: dummy
      ext4_zip: dummy
      sfs_zip: dummy
      sysupgrade_glob: dummy
      openwrt_source_name: dummy
      TARGET_DEVICE_ARCH: dummy
      latest_release: dummy

    runs-on: ubuntu-24.04
    if: github.event.repository.owner.id == github.event.sender.id
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    steps:
      - name: Generate platform variables and print
        id: genvars
        run: |
          # Debug: Print all input variables
          echo "inputs.targets: '${{ inputs.targets }}'"
          echo "inputs.upload_source: '${{ inputs.upload_source }}'"
          echo "inputs.build_firmware: '${{ inputs.build_firmware }}'"
          echo "matrix.name: '${{ matrix.name }}'"
          echo "matrix.script_dir: '${{ matrix.script_dir }}'"
          echo "matrix.arch: '${{ matrix.arch }}'"
          echo "matrix.arch_suffix: '${{ matrix.arch_suffix }}'"
          echo "github.run_id: '${{ github.run_id }}'"

          # Platform name in lowercase
          name_lower=$(echo "${{ matrix.name }}" | tr 'A-Z' 'a-z')

          # seed rule
          seed="${{ matrix.name }}"

          # artifact_prefix rule
          artifact_prefix="${{ matrix.name }}-GC404"

          # sha_match rule
          sha_match="$name_lower"

          # ext4_zip/sfs_zip rule
          if [ "$name_lower" = "x86" ]; then
            ext4_zip='*ext4-combined*'
            sfs_zip='*squashfs-combined*'
            sysupgrade_glob='*combined-efi.img*'
          else
            ext4_zip="*$name_lower*ext4*"
            sfs_zip="*$name_lower*squashfs*"
            sysupgrade_glob='*sysupgrade.img*'
          fi

          # workerid variable
          workerid=${{ github.run_id }}

          # openwrt_source_name archive name
          openwrt_source_name="openwrt-source-${{ matrix.name }}-${workerid}.tar"

          cat <<EOF | tee -a $GITHUB_ENV
          seed=$seed
          artifact_prefix=$artifact_prefix
          sha_match=$sha_match
          ext4_zip=$ext4_zip
          sfs_zip=$sfs_zip
          sysupgrade_glob=$sysupgrade_glob
          openwrt_source_name=$openwrt_source_name
          EOF

      - name: Show system info
        run: |
          echo -e "Total CPU cores\t: $(nproc)"
          cat /proc/cpuinfo | grep 'model name'

      - name: Maximize build space
        if: inputs.build_firmware
        uses: smallprogram/maximize-build-space@master
        with:
          swap-size-mb: 1024
          temp-reserve-mb: 4608
          root-reserve-mb: 3584
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"

      - name: Checkout
        uses: actions/checkout@main

      - name: Init build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update
          sudo /bin/bash -c "$(curl -sL https://git.io/vokNn)"
          sudo -E apt-fast -y -qq install asciidoc bash bcc bin86 binutils bison bzip2 clang file flex g++ g++-multilib gawk gcc-multilib gettext git gzip help2man intltool libbpf-dev libboost-dev libelf-dev libncurses-dev libssl-dev libthread-queue-any-perl libusb-dev libxml-parser-perl linux-tools-generic llvm make patch perl-modules pkg-config python3-dev python3-pip python3-pyelftools python3-setuptools rsync sharutils swig time unzip util-linux wget xsltproc zlib1g-dev zip zstd
          sudo -E apt-fast -y -qq install dos2unix dwarves jq npm quilt
          sudo -H npm install -g pnpm
          sudo -H npm install -g n
          sudo -H n stable
          pip3 install --user -U pylibfdt --break-system-packages
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          sudo -E git config --global user.name 'GitHub Actions' && git config --global user.email 'noreply@github.com'
          sudo -E git config --global core.abbrev auto
          df -h

      - name: Prepare Mixedwrt
        run: |
          sudo chown -R runner:runner /home/runner/work/YAOF
          cp -r ./SCRIPTS/${{ matrix.script_dir }}/. ./SCRIPTS/
          cp -r ./SCRIPTS/. ./
          /bin/bash 01_get_ready.sh

      - name: Prepare Package
        working-directory: ${{ github.workspace }}/openwrt
        env:
          LAN_IP_INPUT: ${{ inputs.lan_ip }}
        run: |
          cp -r ../SCRIPTS/. ./
          /bin/bash 02_prepare_package.sh
          /bin/bash 02_target_only.sh

          ### 默认 LAN IP ###
          LAN_IP="${LAN_IP_INPUT:-192.168.1.1}"
          
          if echo "$LAN_IP" | grep -Eq '^((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])$'; then
            echo "Set default LAN IP to ${LAN_IP}"
          
            if grep -qE 'lan\) ipad=\$\{ipaddr:-"[^"]+"\} ;;' package/base-files/files/bin/config_generate; then
              sed -i -E 's#lan\) ipad=\$\{ipaddr:-"[^"]+"\} ;;#lan) ipad=${ipaddr:-"'"$LAN_IP"'"} ;;#g' package/base-files/files/bin/config_generate
              grep -n 'lan) ipad=' package/base-files/files/bin/config_generate
            else
              echo "LAN default IP pattern not found in config_generate"
              grep -n 'ipad=' package/base-files/files/bin/config_generate || true
              exit 1
            fi
          else
            echo "Invalid LAN IP: ${LAN_IP}"
            exit 1
          fi

          /bin/bash 04_remove_upx.sh

      - name: QTMDFW4
        working-directory: ${{ github.workspace }}/openwrt
        run: |
          cp -rf ../SEED/${{ env.seed }}/config.seed .config

      - name: Convert Translation
        working-directory: ${{ github.workspace }}/openwrt
        run: |
          /bin/bash 03_convert_translation.sh

      - name: Check Translation
        working-directory: ${{ github.workspace }}/openwrt
        run: |
          echo "===== Remaining zh_Hans symlinks ====="
          find package feeds -type l -path '*/po/zh_Hans' -exec sh -c 'printf "%s -> %s\n" "$1" "$(readlink "$1")"' _ {} \; 2>/dev/null || true

          echo "===== Broken symlinks ====="
          find package feeds -xtype l -print 2>/dev/null || true

          echo "===== Remaining po/zh-cn directories ====="
          find package feeds -type d -path '*/po/zh-cn' -print 2>/dev/null || true

      - name: Add ACL
        working-directory: ${{ github.workspace }}/openwrt
        run: |
          /bin/bash 05_create_acl_for_luci.sh -a
      - name: Fix Permissions
        working-directory: ${{ github.workspace }}/openwrt
        run: |
          sudo -E chmod -R 755 ./08_fix_permissions.sh
          /bin/bash 08_fix_permissions.sh

      - name: Make Config
        working-directory: ${{ github.workspace }}/openwrt
        run: |
          make defconfig
          echo "===== ZRAM final config ====="
          grep -E '^(CONFIG_PACKAGE_(zram-swap|kmod-zram|kmod-lib-lzo|kmod-lib-lz4|kmod-lib-zstd)|CONFIG_KERNEL_ZRAM_)' .config || true

      - name: Get Architecture
        id: getarch
        working-directory: ${{ github.workspace }}/openwrt
        run: |
          TARGET_DEVICE_ARCH="$(grep "^CONFIG_TARGET_.*_.*=y$" ".config" | head -n 1 | sed 's/^CONFIG_TARGET_//g' | awk -F '_' '{print $1}')"
          if [ -n "${{ matrix.arch_suffix }}" ]; then
            TARGET_DEVICE_ARCH="$TARGET_DEVICE_ARCH-${{ matrix.arch_suffix }}"
          fi
          echo "TARGET_DEVICE_ARCH=$TARGET_DEVICE_ARCH" >> $GITHUB_ENV
          latest_release="$(curl -s https://github.com/openwrt/openwrt/tags | grep -Eo "v[0-9\.]+\-*r*c*[0-9]*.tar.gz" | sed -n '/[2-9][5-9]/p' | sed -n 1p | sed 's/.tar.gz//g' | sed 's/v//g')"
          echo "latest_release=${latest_release}" >> $GITHUB_ENV

          echo "Package folder ${{ env.openwrt_source_name }}"
          cd ..
          # Must use tar, otherwise symbolic links will be incomplete
          if [ "${{ inputs.upload_source }}" = "true" ]; then
            tar -cf ${{ env.openwrt_source_name }} openwrt
          fi

      # upload_source
      - name: Upload Source Archive
        if: inputs.upload_source
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.openwrt_source_name }}
          path: |
            ${{ env.openwrt_source_name }}
          retention-days: 5

      - name: Cache
        if: inputs.build_firmware
        uses: HiGarfield/cachewrtbuild@main
        with:
          mixkey: ${{ env.TARGET_DEVICE_ARCH }}
          prefix: ${{ github.workspace }}/openwrt
          skip_saving: ${{ !inputs.build_firmware }}

      - name: Make Download
        if: inputs.build_firmware
        working-directory: ${{ github.workspace }}/openwrt
        run: |
          if [ "${{ inputs.upload_source }}" = "true" ] && [ -f ../${{ env.openwrt_source_name }} ]; then
            rm ../${{ env.openwrt_source_name }}
          fi
          make download -j50
          make -j$(($(nproc) + 1)) package/network/utils/nftables/refresh V=s

      # build_firmware
      - name: Compile Openwrt
        if: inputs.build_firmware
        working-directory: ${{ github.workspace }}/openwrt
        id: compileopenwrt
        continue-on-error: true
        run: |
          IGNORE_ERRORS=1 make -j$(($(nproc) + 1))
          echo $?
      - name: If Error
        if: steps.compileopenwrt.outcome == 'failure'
        working-directory: ${{ github.workspace }}/openwrt
        run: |
          cat ./.config
          echo '================================================================'
          make -j1 V=s

      - name: Organize files
        if: inputs.build_firmware
        id: organize
        env:
          LATEST_RELEASE: ${{ env.latest_release }}
        run: |
          rm -rf ./artifact/
          mkdir -p ./artifact/
          mv openwrt/bin/targets/${{ matrix.arch }}/${{ env.sysupgrade_glob }} ./artifact/ || true
          cd ./artifact/
          ls -Ahl
          gzip -d *.gz || true
          gzip --best *.img
          ls -Ahl
          sha256sum openwrt*${{ env.sha_match }}* | tee ${{ env.artifact_prefix }}-$(date +%Y-%m-%d)-${{ env.latest_release }}.sha256sum
          zip ${{ env.artifact_prefix }}-$(date +%Y-%m-%d)-${{ env.latest_release }}-ext4.zip ${{ env.ext4_zip }}
          zip ${{ env.artifact_prefix }}-$(date +%Y-%m-%d)-${{ env.latest_release }}-sfs.zip ${{ env.sfs_zip }}
          ls -Ahl

      - name: Archive recovery packages
        if: inputs.build_firmware
        continue-on-error: true
        shell: bash
        run: |
          set -e
    
          RECOVERY_DIR="${GITHUB_WORKSPACE}/package-recovery"
          PACKAGE_DIR="${RECOVERY_DIR}/packages"
          TARGET_DIR="${GITHUB_WORKSPACE}/openwrt/bin/targets/${{ matrix.arch }}"
          PACKAGEINFO="${GITHUB_WORKSPACE}/openwrt/tmp/.packageinfo"
          SEED_FILE="${GITHUB_WORKSPACE}/SEED/${{ env.seed }}/config.seed"
    
          rm -rf "${RECOVERY_DIR}"
          mkdir -p "${PACKAGE_DIR}"
    
          echo "===== Recovery package archive ====="
          echo "Target: ${{ matrix.name }}"
    
          # 找本次固件 manifest
          MANIFEST="$(
            find "${TARGET_DIR}" \
              -maxdepth 1 \
              -type f \
              -name '*.manifest' \
              | sort \
              | head -n 1
          )"
    
          if [ -z "${MANIFEST}" ]; then
            echo "ERROR: firmware manifest not found"
            exit 1
          fi
    
          if [ ! -f "${PACKAGEINFO}" ]; then
            echo "ERROR: tmp/.packageinfo not found"
            exit 1
          fi
    
          if [ ! -f "${SEED_FILE}" ]; then
            echo "ERROR: config.seed not found: ${SEED_FILE}"
            exit 1
          fi
    
          echo "Seed:     ${SEED_FILE}"
          echo "Manifest: ${MANIFEST}"
    
          cp "${MANIFEST}" \
            "${RECOVERY_DIR}/firmware.manifest"
    
          cp "${GITHUB_WORKSPACE}/openwrt/.config" \
            "${RECOVERY_DIR}/openwrt.config"
    
          python3 - \
            "${SEED_FILE}" \
            "${MANIFEST}" \
            "${PACKAGEINFO}" \
            "${PACKAGE_DIR}" \
            "${GITHUB_WORKSPACE}/openwrt/bin/packages" \
            "${TARGET_DIR}/packages" \
            "${RECOVERY_DIR}" <<'PY'
          import sys
          import re
          import shutil
          import hashlib
          from pathlib import Path
    
          seed_file = Path(sys.argv[1])
          manifest_file = Path(sys.argv[2])
          packageinfo_file = Path(sys.argv[3])
          package_dir = Path(sys.argv[4])
          search_roots = [
              Path(sys.argv[5]),
              Path(sys.argv[6]),
          ]
          recovery_dir = Path(sys.argv[7])
    
          # ==================================================
          # 1. firmware.manifest
          #    本次固件实际安装的包 + 精确版本
          # ==================================================
    
          installed = {}
    
          for line in manifest_file.read_text(
              encoding="utf-8",
              errors="ignore"
          ).splitlines():
    
              line = line.strip()
    
              if " - " not in line:
                  continue
    
              name, version = line.rsplit(" - ", 1)
    
              name = name.strip()
              version = version.strip()
    
              if name and version:
                  installed[name] = version
    
          # ==================================================
          # 2. config.seed
          #    读取 ### APPLICATION ### 块
          # ==================================================
    
          application = set()
          in_application = False
    
          for line in seed_file.read_text(
              encoding="utf-8",
              errors="ignore"
          ).splitlines():
    
              line = line.strip()
    
              if line == "### APPLICATION ###":
                  in_application = True
                  continue
    
              if (
                  in_application
                  and line.startswith("### ")
                  and line.endswith(" ###")
              ):
                  break
    
              if not in_application:
                  continue
    
              match = re.match(
                  r"^CONFIG_PACKAGE_(.+)=y$",
                  line
              )
    
              if match:
                  application.add(match.group(1))
    
          # ==================================================
          # 3. 解析 tmp/.packageinfo
          #
          # 一个 Source-Makefile 可以包含多个 Package
          # 所以必须逐行解析，不能按空行简单切分
          # ==================================================
    
          package_meta = {}
    
          source_makefile = ""
          current_package = None
    
          for raw_line in packageinfo_file.read_text(
              encoding="utf-8",
              errors="ignore"
          ).splitlines():
    
              line = raw_line.strip()
    
              if line.startswith("Source-Makefile:"):
    
                  source_makefile = line.split(
                      ":",
                      1
                  )[1].strip()
    
                  current_package = None
    
                  continue
    
              if line.startswith("Package:"):
    
                  current_package = line.split(
                      ":",
                      1
                  )[1].strip()
    
                  package_meta[current_package] = {
                      "source": source_makefile,
                      "depends": "",
                      "abi": "",
                  }
    
                  continue
    
              if current_package is None:
                  continue
    
              if line.startswith("Depends:"):
    
                  package_meta[current_package]["depends"] = (
                      line.split(
                          ":",
                          1
                      )[1].strip()
                  )
    
              elif line.startswith("ABI-Version:"):
    
                  package_meta[current_package]["abi"] = (
                      line.split(
                          ":",
                          1
                      )[1].strip()
                  )
    
          # ==================================================
          # 4. package/new 和 package/custom
          # ==================================================
    
          def is_custom_source(source):
    
              return (
                  source.startswith("package/new/")
                  or
                  source.startswith("package/custom/")
              )
    
          # ==================================================
          # 5. 处理 ABI-Version
          #
          # packageinfo 使用基础包名
          # manifest 使用最终实际包名
          # ==================================================
    
          def actual_package_name(name):
    
              if name in installed:
                  return name
    
              meta = package_meta.get(name)
    
              if not meta:
                  return None
    
              abi = meta.get("abi", "")
    
              if not abi:
                  return None
    
              # OpenWrt kmod 不使用普通 ABI suffix
              if name.startswith("kmod-"):
                  return None
    
              if name[-1:].isdigit():
                  candidate = (
                      f"{name}-{abi}"
                  )
              else:
                  candidate = (
                      f"{name}{abi}"
                  )
    
              if candidate in installed:
                  return candidate
    
              return None
    
          # ==================================================
          # 6. 初始恢复范围
          #
          # APPLICATION
          # +
          # package/new
          # +
          # package/custom
          # ==================================================
    
          selected = set(application)
    
          for name, meta in package_meta.items():
    
              if is_custom_source(
                  meta["source"]
              ):
                  selected.add(name)
    
          # ==================================================
          # 7. 分析依赖
          # ==================================================
    
          def parse_dependencies(depends):
    
              result = set()
    
              for match in re.finditer(
                  r"\+([^\s,]+)",
                  depends
              ):
    
                  dep = match.group(1)
    
                  # 例如：
                  # +PACKAGE_xxx:package-name
                  # +(COND):package-name
                  if ":" in dep:
                      dep = dep.rsplit(
                          ":",
                          1
                      )[1]
    
                  dep = dep.strip("()")
                  dep = dep.lstrip("!")
    
                  if (
                      not dep
                      or dep.startswith("@")
                  ):
                      continue
    
                  result.add(dep)
    
              return result
    
          # ==================================================
          # 8. 递归补依赖
          #
          # 自动补：
          # package/new
          # package/custom
          # kmod-*
          #
          # 不递归收 libc/base-files 等系统核心包
          # ==================================================
    
          changed = True
    
          while changed:
    
              changed = False
    
              for name in list(selected):
    
                  meta = package_meta.get(name)
    
                  if not meta:
                      continue
    
                  for dep in parse_dependencies(
                      meta["depends"]
                  ):
    
                      # 依赖必须真实存在于本次固件
                      if actual_package_name(dep) is None:
                          continue
    
                      dep_meta = package_meta.get(
                          dep,
                          {}
                      )
    
                      dep_source = dep_meta.get(
                          "source",
                          ""
                      )
    
                      if (
                          dep.startswith("kmod-")
                          or
                          is_custom_source(dep_source)
                      ):
    
                          if dep not in selected:
    
                              selected.add(dep)
                              changed = True
    
          # ==================================================
          # 9. 转换成 manifest 中的实际包名
          # ==================================================
    
          selected_actual = set()
    
          for name in selected:
    
              actual = actual_package_name(name)
    
              if actual:
                  selected_actual.add(actual)
    
          # ==================================================
          # 10. 自动加入 LuCI 语言包
          #
          # luci-app-oaf
          # ->
          # luci-i18n-oaf-zh-cn
          # ==================================================
    
          for name in list(selected):
    
              if not name.startswith("luci-app-"):
                  continue
    
              app_name = name[len("luci-app-"):]
    
              prefix = (
                  f"luci-i18n-{app_name}-"
              )
    
              for installed_name in installed:
    
                  if installed_name.startswith(prefix):
                      selected_actual.add(
                          installed_name
                      )
    
          selected_actual = sorted(
              selected_actual
          )
    
          # ==================================================
          # 11. 保存选择结果
          # ==================================================
    
          (
              recovery_dir /
              "application-selected.txt"
          ).write_text(
              "\n".join(
                  sorted(application)
              ) + "\n",
              encoding="utf-8"
          )
    
          (
              recovery_dir /
              "selected-packages.txt"
          ).write_text(
              "\n".join(
                  f"{name} - {installed[name]}"
                  for name in selected_actual
              ) + "\n",
              encoding="utf-8"
          )
    
          print()
          print("===== Selected packages =====")
    
          for name in selected_actual:
    
              print(
                  f"{name} - "
                  f"{installed[name]}"
              )
    
          print()
          print(
              f"Selected count: "
              f"{len(selected_actual)}"
          )
    
          # ==================================================
          # 12. 建立实际 APK 索引
          # ==================================================
    
          apk_index = {}
    
          for root in search_roots:
    
              if not root.exists():
                  continue
    
              for apk in root.rglob("*.apk"):
    
                  apk_index.setdefault(
                      apk.name,
                      []
                  ).append(apk)
    
          # ==================================================
          # 13. 按 manifest 精确版本寻找 APK
          #
          # OpenWrt APK：
          # actual-package-name-version.apk
          # ==================================================
    
          saved = []
          missing = []
    
          for name in selected_actual:
    
              version = installed[name]
    
              apk_name = (
                  f"{name}-"
                  f"{version}.apk"
              )
    
              matches = apk_index.get(
                  apk_name,
                  []
              )
    
              if not matches:
    
                  missing.append(
                      f"{name} - {version}"
                  )
    
                  print(
                      f"MISS: {apk_name}"
                  )
    
                  continue
    
              # 如果不同目录存在同名 APK，
              # 内容完全一样则直接使用
              if len(matches) > 1:
    
                  digests = {}
    
                  for path in matches:
    
                      digest = hashlib.sha256(
                          path.read_bytes()
                      ).hexdigest()
    
                      digests.setdefault(
                          digest,
                          []
                      ).append(path)
    
                  if len(digests) > 1:
    
                      missing.append(
                          f"{name} - "
                          f"{version} "
                          f"(ambiguous)"
                      )
    
                      print(
                          f"AMBIGUOUS: "
                          f"{apk_name}"
                      )
    
                      continue
    
              source = matches[0]
    
              target = (
                  package_dir /
                  source.name
              )
    
              shutil.copy2(
                  source,
                  target
              )
    
              saved.append(target)
    
              print(
                  f"SAVE: "
                  f"{source.name}"
              )
    
          # ==================================================
          # 14. 缺失列表
          # ==================================================
    
          (
              recovery_dir /
              "missing-packages.txt"
          ).write_text(
              (
                  "\n".join(missing) + "\n"
                  if missing
                  else "None\n"
              ),
              encoding="utf-8"
          )
    
          # ==================================================
          # 15. SHA256
          # ==================================================
    
          sha_lines = []
    
          for path in sorted(saved):
    
              digest = hashlib.sha256(
                  path.read_bytes()
              ).hexdigest()
    
              sha_lines.append(
                  f"{digest}  "
                  f"{path.name}"
              )
    
          (
              recovery_dir /
              "SHA256SUMS"
          ).write_text(
              (
                  "\n".join(sha_lines) + "\n"
                  if sha_lines
                  else "No APK files saved\n"
              ),
              encoding="utf-8"
          )
    
          print()
          print(
              f"Saved APK count: "
              f"{len(saved)}"
          )
    
          print(
              f"Missing APK count: "
              f"{len(missing)}"
          )

          if missing:
              print()
              print("WARNING: Some recovery APKs were not found.")
              print("Firmware build will continue normally.")
              print("See missing-packages.txt for details.")
    
          PY
    
          # 保存编译来源信息
          OPENWRT_COMMIT="$(
            git -C "${GITHUB_WORKSPACE}/openwrt" \
              rev-parse HEAD \
              2>/dev/null \
              || echo unknown
          )"
    
          {
            echo "YAOF_COMMIT=${GITHUB_SHA}"
            echo "OPENWRT_COMMIT=${OPENWRT_COMMIT}"
            echo "TARGET=${{ matrix.name }}"
            echo "TARGET_ARCH=${{ matrix.arch }}"
            echo "OPENWRT_VERSION=${{ env.latest_release }}"
            echo "GITHUB_RUN_ID=${GITHUB_RUN_ID}"
            echo "BUILD_DATE=$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          } > "${RECOVERY_DIR}/BUILD-INFO.txt"
    
          # 打成单独恢复包
          RECOVERY_ZIP="${GITHUB_WORKSPACE}/artifact/${{ env.artifact_prefix }}-$(date +%Y-%m-%d)-${{ env.latest_release }}-packages.zip"
    
          (
            cd "${RECOVERY_DIR}"
    
            zip -qr \
              "${RECOVERY_ZIP}" \
              .
          )
    
          echo
          echo "===== Recovery package created ====="
    
          ls -lh "${RECOVERY_ZIP}"
    
          echo
          echo "===== Recovery APK list ====="
    
          find "${PACKAGE_DIR}" \
            -maxdepth 1 \
            -type f \
            -name '*.apk' \
            -printf '%f\n' \
            | sort

      - name: Create release
        if: inputs.build_firmware
        id: create_release
        uses: ncipollo/release-action@main
        with:
          name: OpenWRT-${{ env.latest_release }}
          allowUpdates: true
          prerelease: false
          tag: ${{ env.latest_release }}
          commit: "25.12"
          replacesArtifacts: true
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: ./artifact/*.zip

      - name: Print Disk Space After
        run: df -h

      - name: Trigger badge sync for current platform
        if: github.workflow == 'OpenWrt-Matrix' && inputs.build_firmware && steps.create_release.outcome != 'skipped' && always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Triggering badge sync for ${{ matrix.name }} with status: ${{ steps.create_release.outcome }}"
          gh workflow run "${{ matrix.name }}-OpenWrt.yml" \
            --field badge_status="${{ steps.create_release.outcome }}" || echo "Failed to trigger ${{ matrix.name }} workflow"
